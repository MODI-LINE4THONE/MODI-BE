name: MODI-BE Docker Publish

on:
  workflow_run:
    workflows:
      - MODI-BE CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: modi-be-production
  cancel-in-progress: false

jobs:
  docker:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            modi12123/modi-be:latest
            modi12123/modi-be:${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          cat > deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -eu

          IMAGE="modi12123/modi-be:__IMAGE_SHA__"

          sudo docker pull "$IMAGE"

          OLD_IMAGE=$(sudo docker inspect modi-be \
            --format '{{.Image}}' 2>/dev/null || true)

          if sudo docker container inspect modi-be >/dev/null 2>&1; then
            sudo docker stop modi-be
            sudo docker rm modi-be
          fi

          SUCCESS=false

          if sudo docker run -d \
            --name modi-be \
            --network host \
            --restart unless-stopped \
            --env-file /etc/modi-be/prod.env \
            "$IMAGE"; then

            for i in $(seq 1 30); do
              if curl -fsS \
                -H "Host: modi.kang0131.shop" \
                -H "X-Forwarded-Proto: https" \
                http://127.0.0.1:8080/v3/api-docs >/dev/null; then
                SUCCESS=true
                break
              fi
              sleep 2
            done
          fi

          if [ "$SUCCESS" = "true" ]; then
            echo "DEPLOY_SUCCESS"
            exit 0
          fi

          echo "Deployment failed. Rolling back."
          sudo docker logs --tail 50 modi-be || true
          sudo docker rm -f modi-be || true

          if [ -n "$OLD_IMAGE" ]; then
            sudo docker run -d \
              --name modi-be \
              --network host \
              --restart unless-stopped \
              --env-file /etc/modi-be/prod.env \
              "$OLD_IMAGE"
          fi

          exit 1
          SCRIPT

          sed -i "s/__IMAGE_SHA__/$IMAGE_SHA/g" deploy.sh

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="$(cat deploy.sh)" \
            --timeout-seconds 300 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM command completed"
          else
            echo "SSM command failed or timed out"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Details:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json