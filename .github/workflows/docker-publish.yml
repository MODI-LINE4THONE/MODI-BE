name: MODI-BE Docker Publish

on:
  workflow_run:
    workflows:
      - MODI-BE CI
    types:
      - completed
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: modi-be-production
  cancel-in-progress: false

jobs:
  docker:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Docker 이미지 빌드 및 업로드
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            modi12123/modi-be:latest
            modi12123/modi-be:${{ github.event.workflow_run.head_sha }}

      # 5. SSH를 이용한 EC2 자동 배포
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -eu

            echo "===== MODI-BE 배포 시작 ====="

            IMAGE="modi12123/modi-be:${{ github.event.workflow_run.head_sha }}"

            # 최신 Docker 이미지 다운로드
            sudo docker pull "$IMAGE"

            # 기존 컨테이너 이미지 저장
            OLD_IMAGE=$(sudo docker inspect modi-be \
              --format '{{.Image}}' 2>/dev/null || true)

            # 기존 컨테이너 중지 및 삭제
            if sudo docker container inspect modi-be >/dev/null 2>&1; then
              echo "기존 컨테이너 종료"
              sudo docker stop modi-be
              sudo docker rm modi-be
            fi

            # 새로운 컨테이너 실행
            echo "새로운 컨테이너 실행"

            STARTED=false

            if sudo docker run -d \
              --name modi-be \
              --network host \
              --restart unless-stopped \
              --env-file /etc/modi-be/prod.env \
              "$IMAGE"; then
              STARTED=true
            fi

            # 서버 정상 실행 확인
            if [ "$STARTED" = "true" ]; then
              for i in $(seq 1 30); do
                if curl -fsS \
                  http://127.0.0.1:8080/v3/api-docs \
                  >/dev/null; then

                  echo "===== MODI-BE 배포 성공 ====="
                  exit 0
                fi

                echo "서버 시작 대기 중... ($i/30)"
                sleep 2
              done
            fi

            # 배포 실패 시 롤백
            echo "===== 배포 실패: 롤백 시작 ====="

            sudo docker logs --tail 50 modi-be || true
            sudo docker rm -f modi-be || true

            if [ -n "$OLD_IMAGE" ]; then
              echo "이전 Docker 이미지로 복구"

              sudo docker run -d \
                --name modi-be \
                --network host \
                --restart unless-stopped \
                --env-file /etc/modi-be/prod.env \
                "$OLD_IMAGE"
            fi

            echo "===== 배포 실패 ====="
            exit 1