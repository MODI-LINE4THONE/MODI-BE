<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MODI WebSocket 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #log {
            background: #f4f4f4;
            padding: 20px;
            margin-top: 20px;
            min-height: 200px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h2>MODI WebSocket 테스트</h2>

<p>키오스크 코드: KIOSK-001</p>

<button onclick="connect()">WebSocket 연결</button>
<button onclick="disconnect()">연결 해제</button>

<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>

<script>
    let client = null;

    function log(message) {
        document.getElementById("log").textContent += message + "\n";
    }

    function connect() {

        if (client && client.active) {
            log("이미 연결되어 있습니다.");
            return;
        }

        client = new StompJs.Client({
            brokerURL: `ws://${location.host}/ws/kiosk`,
            reconnectDelay: 5000,

            onConnect: () => {
                log("✅ WebSocket 연결 성공");

                client.subscribe(
                    "/topic/kiosks/KIOSK-001",
                    (message) => {
                        const data = JSON.parse(message.body);

                        log("📩 메시지 수신:");
                        log(JSON.stringify(data, null, 2));

                        if (data.type === "ACCESSIBILITY_APPLY") {
                            log("✅ 접근성 설정 적용 메시지 수신");
                        }

                        if (data.type === "ACCESSIBILITY_RESET") {
                            log("✅ 접근성 설정 초기화 메시지 수신");
                        }
                    }
                );
            },

            onStompError: (frame) => {
                log("❌ STOMP 오류: " + frame.headers.message);
            },

            onWebSocketClose: () => {
                log("🔌 WebSocket 연결 종료");
            },

            onWebSocketError: () => {
                log("❌ WebSocket 연결 오류");
            }
        });

        client.activate();
    }

    function disconnect() {
        if (client) {
            client.deactivate();
            log("WebSocket 연결 해제 요청");
        }
    }
</script>

</body>
</html>
